*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#061827;
    color:white;
}

/* NAVBAR */
nav{
    position:fixed;
    top:0;
    width:100%;
    height:75px;
    padding:0 5%;
    background:rgba(3,18,30,.88);
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
    border-bottom:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(8px);
}

.logo{
    font-size:30px;
    font-weight:900;
    color:white;
}

nav ul{
    display:flex;
    list-style:none;
    gap:35px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    font-size:16px;
}

nav a:hover{
    color:#168cff;
}

/* HERO */
.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    overflow:hidden;

    background-image:
    linear-gradient(90deg,
    rgba(2,18,31,.98) 0%,
    rgba(2,18,31,.85) 28%,
    rgba(2,18,31,.25) 55%,

    background-size:cover;
    background-position:center;
}

.hero-content{
    width:45%;
    margin-left:6%;
    z-index:2;
}

.welcome{
    font-size:35px;
    font-style:italic;
    font-weight:bold;
    margin-bottom:5px;
}

.hero h1{
    font-size:90px;
    line-height:.9;
    font-weight:900;
    letter-spacing:-3px;
}

.hero h2{
    font-size:95px;
    line-height:1;
    color:#168cff;
    font-weight:900;
    font-style:italic;
}

.quote{
    margin-top:25px;
    font-size:20px;
    line-height:1.5;
    font-weight:bold;
    max-width:420px;
}

.garis{
    width:300px;
    height:8px;
    background:#168cff;
    transform:rotate(-5deg);
    margin-top:20px;
    border-radius:50%;
}
